name: Update Medium articles

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-medium-articles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: medium/package-lock.json

      - name: Install dependencies
        working-directory: medium
        run: npm ci

      - name: Fetch Medium articles
        working-directory: medium
        run: npm run fetch-articles

      - name: Commit changes
        run: |
          if git diff --quiet -I '^// Generated on:' -- medium-articles.js; then
            echo "No new Medium articles."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medium-articles.js
          git commit -m "Update Medium articles"
          git push
